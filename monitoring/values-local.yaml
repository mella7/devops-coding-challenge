# trimmed footprint for kube-prometheus-stack on local kind clusters -
# the chart's defaults assume real cluster resources, not a laptop
alertmanager:
  enabled: false   # not needed for local demo purposes

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

prometheus-node-exporter:
  enabled: false   # reports host-level metrics we don't need for this demo

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 10
  readinessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 10

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
