name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # throwaway MySQL for this job only - Flyway/the app need a real DB to boot
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dev
          MYSQL_DATABASE: challenge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/challenge
          SPRING_DATASOURCE_WRITER_URL: jdbc:mysql://127.0.0.1:3306/challenge
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: dev
        run: ./mvnw -B clean verify


  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crewmeister-challenge:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: crewmeister-challenge:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
