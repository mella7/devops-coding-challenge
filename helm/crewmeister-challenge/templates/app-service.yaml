# exposes the app pod inside the cluster on a stable DNS name
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  # only set on aws, requests a Network Load Balancer instead of the default
  # Classic Load Balancer eks falls back to when this is left out
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Release.Name }}-app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
