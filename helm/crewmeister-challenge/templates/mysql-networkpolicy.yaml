# restricts mysql pod traffic to only accept connections from the app pod.
# Same CNI enforcement caveat as app-networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mysql-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-app
      ports:
        - protocol: TCP
          port: 3306
